<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>kyros</title>
  <meta name="description" content="personal portfolio" />

  <meta property="og:title" content="portfolio" />
  <meta property="og:description" content="personal portfolio" />
  <meta property="og:type" content="website" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <!-- Blurred ambient backdrop (uses images/bg.png) -->
  <div class="bg-layer" aria-hidden="true">
    <img class="bg-img" src="images/bg.png" alt="" />
    <div class="bg-overlay"></div>
  </div>

  <!-- Rounded "window" frame: everything outside is painted with --frame -->
  <div class="frame-vignette" aria-hidden="true"></div>

  <!-- Dynamic-island navigation -->
  <header class="island">
    <span class="notch-corner notch-left"></span>
    <span class="notch-corner notch-right"></span>
    <nav id="nav" aria-label="Sections">
      <a class="nav-link" href="?tab=home" data-tab="home">
        <svg viewBox="0 0 256 256" aria-hidden="true"><path d="M224,120v96a8,8,0,0,1-8,8H40a8,8,0,0,1-8-8V120a15.87,15.87,0,0,1,4.69-11.32l80-80a16,16,0,0,1,22.62,0l80,80A15.87,15.87,0,0,1,224,120Z"/></svg>
        <span class="label"><span>home</span></span>
      </a>
      <a class="nav-link" href="?tab=music" data-tab="music">
        <svg viewBox="0 0 256 256" aria-hidden="true"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24ZM72,128a8,8,0,0,1-16,0,72.08,72.08,0,0,1,72-72,8,8,0,0,1,0,16A56.06,56.06,0,0,0,72,128Zm32,0a24,24,0,1,1,24,24A24,24,0,0,1,104,128Zm24,72a8,8,0,0,1,0-16,56.06,56.06,0,0,0,56-56,8,8,0,0,1,16,0A72.08,72.08,0,0,1,128,200Z"/></svg>
        <span class="label"><span>music</span></span>
      </a>
      <a class="nav-link" href="?tab=projects" data-tab="projects">
        <svg viewBox="0 0 256 256" aria-hidden="true"><path d="M232,88V200.89A15.13,15.13,0,0,1,216.89,216H40a16,16,0,0,1-16-16V64A16,16,0,0,1,40,48H93.33a16.12,16.12,0,0,1,9.6,3.2L130.67,72H216A16,16,0,0,1,232,88Z"/></svg>
        <span class="label"><span>projects</span></span>
      </a>
      <a class="nav-link" href="?tab=more" data-tab="more">
        <svg viewBox="0 0 256 256" aria-hidden="true"><path d="M156,128a28,28,0,1,1-28-28A28,28,0,0,1,156,128ZM48,100a28,28,0,1,0,28,28A28,28,0,0,0,48,100Zm160,0a28,28,0,1,0,28,28A28,28,0,0,0,208,100Z"/></svg>
        <span class="label"><span>more</span></span>
      </a>
    </nav>
  </header>

  <!-- Scrollable content viewport -->
  <main class="viewport" id="viewport">
    <section class="page" data-page="home"></section>
    <section class="page" data-page="music" hidden></section>
    <section class="page" data-page="projects" hidden></section>
    <section class="page" data-page="more" hidden></section>
    <section class="page" data-page="contact" hidden></section>
  </main>

  <!-- Modal host -->
  <div class="modal-backdrop" id="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal" role="document"></div>
  </div>

  <!-- Spotify "Now Playing" experience (live via Lanyard + LRCLIB lyrics) -->
  <div class="sp" id="player" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="sp-glow" aria-hidden="true"></div>
    <div class="sp-inner">
      <button class="sp-close" type="button" data-player-close aria-label="Close now playing"></button>

      <div class="sp-stage" id="sp-stage">
        <section class="sp-now">
          <div class="sp-art">
            <span class="sp-art-ph" id="sp-art-ph"></span>
            <img class="sp-art-img" id="sp-art" alt="" />
            <span class="sp-art-grad" aria-hidden="true"></span>
          </div>
          <div class="sp-meta">
            <h2 class="sp-title" id="sp-title">—</h2>
            <p class="sp-artist" id="sp-artist"></p>
          </div>
          <div class="sp-progress">
            <div class="sp-track" role="presentation"><span class="sp-fill" id="sp-fill"></span></div>
            <div class="sp-times">
              <span id="sp-elapsed">0:00</span>
              <span id="sp-remaining">-0:00</span>
            </div>
          </div>
          <div class="sp-controls" aria-hidden="true">
            <span class="sp-ic" data-ic="shuffle"></span>
            <span class="sp-ic" data-ic="prev"></span>
            <span class="sp-ic sp-ic-main" data-ic="pause"></span>
            <span class="sp-ic" data-ic="next"></span>
            <span class="sp-ic" data-ic="repeat"></span>
          </div>
        </section>

        <section class="sp-lyrics">
          <div class="sp-lyrics-scroll" id="sp-lyrics"></div>
        </section>
      </div>

      <div class="sp-inactive" id="sp-inactive" hidden>
        <div class="sp-eq" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
        <p class="sp-inactive-title">not listening right now</p>
        <p class="sp-inactive-sub" id="sp-inactive-sub">spotify activity will appear here automatically</p>
      </div>
    </div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
